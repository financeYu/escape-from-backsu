]

[no_lookahead_validation]
required_time_fields = [
  "decision_time",
  "execution_time",
  "label_time",
  "label_availability_time",
]
feature_time_must_be_lte_decision_time = true
source_availability_must_be_lte_decision_time = true
label_time_must_be_after_decision_time = true
label_availability_must_be_after_decision_time = true

[paths]
canonical_price_data_dir = "data/price"
canonical_financial_data_dir = "data/financial"
current_price_cache_dir = "chart_mvp/data"
current_scan_results_dir = "chart_mvp/data/scan_results"
current_output_dir = "chart_mvp/outputs"
current_chart_output_dir = "chart_mvp/outputs/charts"
current_provider_dir = "chart_mvp/src/stock_core/providers"
current_cache_module = "chart_mvp/src/stock_core/cache/csv_cache.py"

[universe]
name = "KOSPI200"
expected_constituent_count = 200
current_snapshot_path = "chart_mvp/universe/kospi200_snapshot.csv"
fallback_provider_snapshot_path = "chart_mvp/src/stock_core/providers/kospi200.csv"
point_in_time_membership_status = "not_verified"

[ticker]
dtype = "string"
format = "six_character_uppercase_alphanumeric"
leading_zero_preservation_required = true
integer_ticker_loading_allowed = false

[ohlcv_schema]
required_columns = ["ticker", "date", "open", "high", "low", "close", "volume"]
optional_runtime_columns = ["source", "name", "market", "data_vendor", "collected_at"]
numeric_columns = ["open", "high", "low", "close", "volume"]
duplicate_key = ["ticker", "date"]
date_parseability_required = true

[preprocess]
raw_price_input_glob = "chart_mvp/data/*_daily_prices.csv"
processed_price_output_path = "data/processed/daily_ohlcv.csv"
summary_report_path = "reports/preprocess/preprocess_summary.md"
validation_summary_path = "reports/preprocess/preprocess_validation_summary.csv"
invalid_rows_report_path = "reports/preprocess/preprocess_invalid_rows.csv"
future_date_policy = "reject_and_report"
invalid_row_policy = "reject_and_report"
financial_data_status = "valuation_deferred"

[indicators]
input_price_path = "data/processed/daily_ohlcv.csv"
output_path = "data/processed/technical_indicators.csv"
summary_report_path = "reports/indicators/indicator_summary.md"
validation_report_path = "reports/indicators/indicator_validation_summary.csv"

[aliases]
ticker = ["ticker", "code", "종목코드"]
date = ["date", "날짜", "일자"]
open = ["open", "시가"]
high = ["high", "고가"]
low = ["low", "저가"]
close = ["close", "종가"]
volume = ["volume", "거래량"]
source = ["source", "data_source"]

[financial_data]
status = "valuation_deferred"
usage = "inventory_only"
gui_display = "allowed_if_already_present"
technical_scoring_allowed = false
final_composite_allowed = false
current_cache_pattern = "chart_mvp/data/*_financial_statements.csv"
cached_sample_status = "local_runtime_cache_generated_for_step_2_validation_not_source_controlled"
point_in_time_status = "unverified"

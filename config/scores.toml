[status]
# These flags describe config-driven runtime activation, not whether Step 9
# score code or Step 15/20 ranking contracts exist in source. Current MVP source
# status is documented in docs/context/MVP_V0_1_BASELINE.md and docs/contracts/.
score_implementation = "source_implemented_for_mvp_v0_1_config_activation_disabled"
active_technical_scores = false
active_composite_score = false
active_valuation_scores = false
active_fundamental_scores = false
step_policy = "post_step20_prefreeze_guardrail_config_not_runtime_activation"

[branch_policy]
policy_doc = "docs/score_branch_policy.md"
selection_criteria_doc = "docs/selection_criteria.md"
allowed_branches = ["technical", "valuation", "diagnostic", "hybrid", "out_of_scope"]
runtime_enabled_branches = []
technical_status = "definition_allowed_only"
valuation_status = "valuation_deferred"
diagnostic_status = "diagnostics_only_not_alpha"
hybrid_status = "blocked_by_data_until_point_in_time_valuation_is_verified"
out_of_scope_status = "reject_or_defer"
price_only_valuation_language_allowed = false
financial_data_in_technical_score = false
financial_data_in_final_composite_score = false

[technical_scores]
enabled = []
implemented = []
placeholders = []
notes = "Config-driven activation remains off. MVP v0.1 source contracts define the approved technical ranking path."

[diagnostics]
enabled = []
implemented = []
diagnostics_are_alpha = false

[composite]
enabled = false
implemented = false
# These remain `not_implemented` for the Step 11 config-activation guardrail.
# The Step 15/20 source contracts define MVP v0.1 composite behavior.
technical_composite_score = "not_implemented"
final_composite_score = "not_implemented"

[valuation_scores]
enabled = []
implemented = []
status = "valuation_deferred"
financial_data_usage = "inventory_only"

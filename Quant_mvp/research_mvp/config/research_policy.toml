[policy_metadata]
policy_version = "research_policy.v3"
evidence_schema_version = "evidence_card.v2"

[guardrails]
no_score_adoption = true
no_backtest = true
no_alpha_claim = true
pdf_download_default = false
require_manual_review_for_hybrid = true
require_point_in_time_warning_for_fundamentals = true
do_not_infer_valuation_from_price = true
scholar_snippets_are_not_evidence = true
citation_count_does_not_upgrade_confidence = true

[pdf_policy]
allow_pdf = true
explicit_confirmation_required = true
confirmation_phrase = "I confirm OA/license/source policy for PDF use"
max_downloads_per_run = 3
timeout_seconds = 30
max_pdf_bytes = 26214400
user_agent = "research-ingestion-pdf-downloader/1.0"
allowed_manifest_categories = [
  "auto_cc",
  "noncommercial_cc",
]
noncommercial_collection_basis = "noncommercial_research_only"

[license_policy]
intended_use = "noncommercial_research"
allow_metadata_without_license = true
allow_noncommercial_licenses = true
manual_review_when_license_unknown = false
fulltext_download_remains_disabled = false
allowed_open_license_tokens = [
  "cc0",
  "publicdomain",
  "publicdomainmark",
  "cc-by",
  "cc-by-sa",
  "cc-by-nd",
]
allowed_noncommercial_license_tokens = [
  "cc-by-nc",
  "cc-by-nc-sa",
  "cc-by-nc-nd",
]
allowed_pdf_license_tokens = [
  "cc-by",
  "cc-by-sa",
  "cc-by-nd",
  "cc-by-nc",
  "cc-by-nc-sa",
  "cc-by-nc-nd",
]
blocked_fulltext_license_tokens = [
  "elsevier-tdm",
  "springer-nature-tdm",
  "wiley-tdm",
  "tdm-license",
  "tdm-only",
]
notes_ko = "PDF/fulltext 수집은 명시적인 open 또는 비상업 연구 호환 license 후보에 한해 source, access, local custody 점검 후 허용한다."

[fulltext_access_policy]
blocked_access_markers = [
  "paywall",
  "login",
  "logged-in",
  "subscription",
  "subscriber",
  "institutional access",
  "shibboleth",
  "sso",
  "tdm",
]
blocked_source_types = [
  "paywalled_publisher_pdf",
  "login_required_pdf",
  "subscription_pdf",
  "tdm_license_pdf",
]
exclude_scholar_urls = true
exclude_non_pdf_response = true
external_upload_default_allowed = false
redistribution_default_allowed = false
notes_ko = "paywall/login/Scholar URL, 비PDF 응답, Wiley/Elsevier/Springer TDM license류 fulltext는 자동 수집하지 않는다."

[local_data_policy]
local_only_by_default = true
github_upload_required = false
not_dirty_when_untracked = true
git_tracking_check_required = true
generated_raw_fulltext_git_tracked_allowed = false
git_tracking_check_paths = [
  "data/research/raw",
  "data/research/fulltext",
  "data/research/request_cache",
]
reason_ko = "리서치 수집 데이터는 저작권, source terms, 비상업 연구 목적 제한, 재배포 제한 준수를 위해 로컬로만 관리한다. GitHub에 업로드하지 않는 것은 더티 데이터가 아니라 의도된 local-only custody 정책이다."
includes = [
  "raw_metadata_snapshots",
  "normalized_paper_corpora",
  "evidence_card_jsonl",
  "scholar_discovery_seeds",
  "local_pdf_or_fulltext_artifacts",
  "request_caches",
  "generated_ingestion_reports",
]
source_control_policy_ko = "GitHub에는 재배포가 안전한 source code, config, tests, small policy/review fixtures만 추적한다."

[outputs]
normalized_jsonl = "data/research/normalized/papers.jsonl"
evidence_jsonl = "data/research/evidence/evidence_cards.jsonl"
unresolved_scholar_seeds_jsonl = "data/research/discovery/google_scholar/unresolved_scholar_seeds.jsonl"

[refresh_policy]
enabled = true
interval_days = 14
stale_after_days = 21
default_profile = "fast_refresh"
source_parallelism_enabled = true
source_parallelism = 4
default_sources = ["arxiv", "openalex", "crossref", "semantic_scholar", "nber"]
default_query_sets = [
  "technical_momentum",
  "technical_mean_reversion",
  "technical_breakout",
  "technical_volatility_liquidity",
  "technical_trend_efficiency",
  "technical_time_series_momentum",
  "technical_cross_sectional_momentum",
  "technical_mean_reversion_extended",
  "technical_oscillator_divergence",
  "technical_breakout_confirmation",
  "technical_volatility_regime",
  "technical_range_position",
  "technical_liquidity_proxy_daily",
  "technical_volume_price_confirmation",
  "technical_correlation_redundancy",
  "technical_rank_stability_diagnostics",
  "technical_turnover_cost_diagnostics",
  "methodology_diagnostics",
  "backtest_methodology",
  "methodology_multiple_testing",
  "methodology_survivorship_lookahead",
  "methodology_publication_bias",
  "korea_kospi_context",
  "korea_kospi_expanded",
  "asia_pacific_equity_context",
  "emerging_market_equity_anomalies",
]
preserve_existing_papers = true
write_new_only_artifact = true
regenerate_evidence_cards = "policy_or_schema_version_change_only"
recheck_unresolved_scholar_seeds = true
fundamental_valuation_refresh = "opt_in_only"

[request_cache]
enabled = true
policy_version = "research_policy.v3"
default_ttl_days = 14
key_fields = ["source", "query", "page_or_offset", "page_size", "policy_version"]

[refresh_profiles.fast_refresh]
description_ko = "OpenAlex 중심 빠른 freshness 확인. 핵심 technical query-set만 실행한다."
cadence = "daily_or_manual"
sources = ["openalex"]
query_sets = [
  "technical_momentum",
  "technical_mean_reversion",
  "technical_breakout",
  "technical_volatility_liquidity",
  "technical_trend_efficiency",
  "technical_volume_price_confirmation",
]
request_cache_ttl_days = 7
valuation_fundamental = "excluded"

[refresh_profiles.full_refresh]
description_ko = "주 1회 또는 수동 실행용 전체 research-ingestion refresh."
cadence = "weekly_or_manual"
sources = ["arxiv", "openalex", "crossref", "semantic_scholar", "nber"]
query_sets = [
  "technical_momentum",
  "technical_mean_reversion",
  "technical_breakout",
  "technical_volatility_liquidity",
  "technical_trend_efficiency",
  "technical_time_series_momentum",
  "technical_cross_sectional_momentum",
  "technical_mean_reversion_extended",
  "technical_oscillator_divergence",
  "technical_breakout_confirmation",
  "technical_volatility_regime",
  "technical_range_position",
  "technical_liquidity_proxy_daily",
  "technical_volume_price_confirmation",
  "technical_correlation_redundancy",
  "technical_rank_stability_diagnostics",
  "technical_turnover_cost_diagnostics",
  "methodology_diagnostics",
  "backtest_methodology",
  "methodology_multiple_testing",
  "methodology_survivorship_lookahead",
  "methodology_publication_bias",
  "korea_kospi_context",
  "korea_kospi_expanded",
  "asia_pacific_equity_context",
  "emerging_market_equity_anomalies",
]
request_cache_ttl_days = 14
valuation_fundamental = "excluded"

[refresh_profiles.diagnostic_refresh]
description_ko = "methodology, bias, cost, redundancy 전용 refresh."
cadence = "weekly_or_manual"
sources = ["openalex", "crossref", "semantic_scholar", "nber"]
query_sets = [
  "technical_correlation_redundancy",
  "technical_rank_stability_diagnostics",
  "technical_turnover_cost_diagnostics",
  "methodology_diagnostics",
  "backtest_methodology",
  "methodology_multiple_testing",
  "methodology_survivorship_lookahead",
  "methodology_publication_bias",
]
request_cache_ttl_days = 14
valuation_fundamental = "excluded"

[refresh_profiles.regional_refresh]
description_ko = "Korea/APAC/EM context 전용 refresh."
cadence = "weekly_or_manual"
sources = ["openalex", "crossref", "semantic_scholar", "nber"]
query_sets = [
  "korea_kospi_context",
  "korea_kospi_expanded",
  "asia_pacific_equity_context",
  "emerging_market_equity_anomalies",
]
request_cache_ttl_days = 14
valuation_fundamental = "excluded"

[refresh_profiles.valuation_fundamental_opt_in]
description_ko = "valuation/fundamental 문헌 수집은 명시 opt-in 전용이다. scoring이나 valuation verdict를 만들지 않는다."
cadence = "manual_only"
sources = ["openalex", "crossref", "semantic_scholar", "nber"]
query_sets = ["fundamental_valuation"]
request_cache_ttl_days = 28
valuation_fundamental = "requires_cli_include_valuation"

[relevance_defaults]
min_positive_keyword_hits = 1
reject_on_exclude_keyword = true
manual_review_when_abstract_missing = true

[query_sets.technical_momentum]
description_ko = "일간 가격 기반 momentum, trend, relative strength 후보 문헌"
keywords = [
  "momentum",
  "momentum effect",
  "relative strength",
  "trend following",
  "return continuation",
  "buying winners",
  "selling losers",
  "stock returns",
  "equity returns",
  "daily returns",
  "technical analysis",
  "cross sectional momentum",
  "time series momentum",
]
branch_hint = "technical"
management_lane = "quant_algorithm"
exclude_keywords = [
  "intraday",
  "options",
  "crypto",
  "order book",
  "LLM",
  "large language model",
  "multi-agent",
  "news",
  "fundamental",
  "fundamentals",
  "macro",
]
max_results = 50
queries = [
  "daily stock momentum technical indicators cross sectional ranking",
  "time series momentum equity daily returns technical analysis",
  "relative strength stock ranking daily OHLCV",
]

[query_sets.technical_momentum.source_overrides.arxiv]
queries = [
  "cat:q-fin.ST AND all:momentum AND all:stock",
  "cat:q-fin.PM AND all:momentum",
]

[query_sets.technical_momentum.source_overrides.openalex]
queries = [
  "returns buying winners selling losers stock market efficiency",
  "cross sectional momentum stock returns technical analysis",
]

[query_sets.technical_momentum.source_overrides.crossref]
queries = [
  "equity momentum daily returns technical analysis",
  "relative strength stock returns",
]

[query_sets.technical_momentum.source_overrides.semantic_scholar]
queries = [
  "equity momentum daily returns technical analysis",
  "relative strength stock ranking daily returns",
]

[[query_sets.technical_momentum.required_keyword_groups]]
name = "signal"
keywords = [
  "momentum",
  "momentum effect",
  "relative strength",
  "trend following",
  "return continuation",
  "buying winners",
  "selling losers",
]

[[query_sets.technical_momentum.required_keyword_groups]]
name = "market_context"
keywords = [
  "stock",
  "stocks",
  "equity",
  "equities",
  "returns",
  "daily returns",
  "technical analysis",
  "cross section",
  "cross sectional",
]


# Route-only registry for future extension ideas.
# Entries here do not authorize implementation or Step 21 entry.

status = "routing_only"
baseline = "docs/context/MVP_V0_1_BASELINE.md"
archive_index = "docs/context/ARCHIVE_INDEX.md"

[extension_readiness.market_policy_refactor]
state = "contract_only"
permission = "root/master approved MVP v0.1 pre-freeze readiness refactor; does not authorize implementation"
context = "docs/extension/mvp_v0_1_prefreeze_market_readiness.md"
allowed = [
  "policy injection points",
  "symbol validation policy",
  "universe metadata preservation",
  "deterministic synthetic tests",
]
forbidden = [
  "live market data ingestion",
  "new universe activation",
  "futures/options pricing or chain logic",
  "ranking across multiple universes",
  "score or ranking semantic changes",
]

[extension.kosdaq150]
state = "not_implemented"
permission = "requires separately approved post-MVP step"
context = "docs/context/domain/future_multi_universe_context.md"

[extension.futures_options]
state = "not_implemented"
permission = "requires separately approved post-MVP step"
context = "docs/context/domain/future_derivatives_context.md"

[extension.nasdaq_or_overseas]
state = "not_implemented"
permission = "requires separately approved post-MVP step"
context = "docs/context/domain/future_multi_universe_context.md"

[extension.valuation_fundamental_scoring]
state = "candidate_only_not_activated"
permission = "requires separately approved post-MVP step and point-in-time availability proof"
context = "docs/context/domain/valuation_context.md"

[extension.scoring_v0_2]
state = "not_implemented"
permission = "requires separately approved post-MVP step, score contract, validation profile, and conflict checkpoint"
context = "docs/context/domain/technical_scoring_context.md"
forbidden_during_mvp_v0_1 = [
  "score formula changes",
  "normalization changes",
  "score weight changes",
  "adoption state changes",
  "ranking semantic changes",
  "backtest feedback into scoring or ranking",
  "valuation/fundamental data in technical_composite_score or final_composite_score",
]

[extension.v0_1n_strategy_composition]
state = "planning_design_only"
permission = "post-MVP candidate planning line only; does not authorize implementation, production scoring, ranking, backtest optimization, or v0.2 freeze"
context = "docs/extension/v0_1n_strategy_composition_v0_2_plan.md"
approval_packet = "docs/extension/v0_1n_implementation_approval_packet.md"
candidate_line = "v0.1n"
target_release_line = "v0.2"
stage_a_status = "approved_doc_contract_only"
stage_a_runtime_approval = false
allowed = [
  "candidate schemas",
  "base strategy registry design",
  "strategy composition feature table design",
  "walk-forward validation design",
  "calibration diagnostics design",
  "evaluation-only backtest boundary design",
  "implementation approval checklist preparation",
]
forbidden = [
  "MVP v0.1 score, ranking, report, or backtest contract changes",
  "production activation of prob_up_1d_candidate",
  "KOSDAQ150, futures/options, overseas, or multi-universe activation",
  "new market data sources",
  "backtest feedback into score formula or model selection for the same period",
  "opaque ML pipeline without inspectable base strategy inputs",
  "trading recommendations, proven-alpha, expected-return, or guaranteed-superiority claims",
]

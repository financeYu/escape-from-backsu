[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "master-mvp"
version = "0.1.0"
description = "Root integration workspace for the KOSPI200 technical multi-score scanner MVP."
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "requests>=2.31.0",
    "matplotlib>=3.7.0",
    "lxml>=4.9.0",
]

[tool.setuptools.packages.find]
include = ["src*", "Quant_mvp*"]

probability_output_contract = "docs/extension/v0_2_probability_output_contract.md"
model_input_handoff_contract = "docs/extension/v0_2_model_input_handoff_contract.md"
diagnostic_output_schema = "docs/extension/v0_2_diagnostic_output_schema.md"

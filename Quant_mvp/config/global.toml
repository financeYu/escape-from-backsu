[project]
name = "Quant_mvp"
market = "KOSPI200"
frequency = "daily"
timezone = "Asia/Seoul"
base_currency = "KRW"

[instrument_identity]
asset_class = "equity"
symbol_policy = "kospi200_korean_equity_6"
extension_readiness_policy = "contract_only_no_activation"

[communication]
progress_language = "ko"
status_language = "ko"
documentation_language = "en"
allow_user_override = true

[branches]
technical_enabled = true

[external_agents]
research_ingestion_agent_path = "research_mvp/AGENTS.md"
research_intake_contract_path = "config/research_intake.toml"
valuation_review_skill_path = "../.agents/skills/valuation_review/SKILL.md"
valuation_examples_path = "docs/valuation_agent_examples.md"
valuation_score_examples_path = "../.agents/skills/valuation_review/references/valuation_scores.example.toml"

[scoring]
neutral_score = 50.0
score_min = 0.0
score_max = 100.0
allow_partial_branch_composite = true

[policy]
hardcoding_default = "forbidden"
allow_narrow_documented_exception = true
config_version = "0.1.0"

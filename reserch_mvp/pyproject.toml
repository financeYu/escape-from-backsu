[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "reserch-mvp-research-ingestion"
version = "0.1.0"
description = "Metadata-only research ingestion CLI for the master_mvp research workspace."
requires-python = ">=3.11"

[project.scripts]
research-ingestion = "research_ingestion.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

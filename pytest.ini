[pytest]
testpaths =
    tests
    Quant_mvp/tests
    chart_mvp/tests
    review_mvp/tests
pythonpath =
    chart_mvp/src
    Quant_mvp/src
norecursedirs =
    .git
    .pytest_cache
    __pycache__
    tests/_tmp
    */tests/_tmp
    **/tests/_tmp
    .venv
    venv
addopts =
    --ignore=tests/_tmp

# Candidate-only v0.2 ML score configuration.
# This config defines contract semantics only; it does not activate production ranking.
# Gate 1 is contract freeze only; it does not train a model or generate sidecar files.

[candidate_score]
name = "prob_up_1d_candidate"
version = "v0.2"
status = "candidate_only"
output_type = "sidecar_candidate_only"
description = "Modeled probability that adjusted_close[t+1] > adjusted_close[t] using features available at decision_time."
higher_is_better = true
production_rank_activation = false
replace_technical_composite_score = false
replace_final_composite_score = false
allow_trading_recommendations = false

[adjusted_close_source]
label_source_field = "adjusted_close"
repo_availability_status = "CONFIRMED_EXISTING_OPTIONAL_ALIAS_ADJ_CLOSE"
known_optional_aliases = ["adj_close"]
approved_aliases = ["adj_close"]
require_canonical_adjusted_close = true
allow_close_fallback = false
allow_new_market_data_ingestion = false
must_validate_before_label_construction = true
canonicalization_rule = "Use adjusted_close when present; otherwise normalize existing optional adj_close to adjusted_close before label construction."
close_alias_status = "not_approved"

[universe]
baseline = "MVP_v0_1_frozen"
market = "KOSPI200"
allow_new_market_activation = false
allow_kosdaq = false
allow_derivatives = false
allow_overseas = false

[timing]
decision_time_field = "decision_time"
execution_time_field = "execution_time"
label_time_field = "label_time"
label_availability_time_field = "label_availability_time"
label_field = "up_1d_label"
label_definition = "adjusted_close[t+1] > adjusted_close[t]"
exclude_unlabeled_current_row_from_training = true
require_features_available_at_or_before_decision_time = true
require_execution_time_after_decision_time = true
require_label_time_after_decision_time = true
require_label_availability_after_decision_time = true
allow_future_data = false
allow_lookahead = false

[outputs]
probability_field = "prob_up_1d_candidate"
rank_field = "prob_up_1d_candidate_sidecar_rank"
status_field = "prob_up_1d_candidate_status"
sample_role_field = "prob_up_1d_candidate_sample_role"
required_output_fields = [
  "ticker",
  "date",
  "decision_time",
  "execution_time",
  "label_time",
  "label_availability_time",
  "prob_up_1d_candidate",
  "prob_up_1d_candidate_status",
  "prob_up_1d_candidate_sample_role",
]
forbidden_production_fields_to_write = [
  "technical_composite_score",
  "final_composite_score",
  "rank",
  "production_rank",
]

[sidecar_ranking]
enabled = false
contract_defined = true
implementation_status = "not_implemented_gate_1"
artifact_type = "sidecar_candidate_only"
sort_fields = ["prob_up_1d_candidate", "ticker"]
sort_directions = ["desc", "asc"]
ties = "ticker_ascending"
feeds_production_ranking = false
feeds_reports = false
feeds_gui = false
feeds_composite_scores = false

[sidecar_output_path]
root = "reports/v0_2_predictive_probability/candidate_sidecar"
filename_template = "prob_up_1d_candidate_candidate_only_sidecar_{as_of_date}.csv"
manifest_template = "prob_up_1d_candidate_candidate_only_sidecar_{as_of_date}.manifest.json"
as_of_date_format = "YYYYMMDD"
generation_implemented_in_gate_1 = false
required_schema = [
  "ticker",
  "date",
  "decision_time",
  "execution_time",
  "prob_up_1d_candidate",
  "prob_up_1d_candidate_status",
  "prob_up_1d_candidate_sample_role",
  "feature_set_version",
  "label_contract_version",
]
forbidden_schema_fields = [
  "technical_composite_score",
  "final_composite_score",
  "rank",
  "production_rank",
  "recommendation_text",
  "forecasted_return",
  "valuation_signal",
]

[sidecar_selection_packet]
enabled = true
packet_type = "candidate_sidecar_selection_packet"
implementation_path = "src.scores.prob_up_1d_candidate.build_prob_up_1d_candidate_selection_packet"
export_path = "src.scores.prob_up_1d_candidate.export_prob_up_1d_candidate_selection_packet"
schema_validator = "src.scores.prob_up_1d_candidate.validate_prob_up_1d_selection_packet_schema"
sort_fields = ["prob_up_1d_candidate", "ticker"]
sort_directions = ["desc", "asc"]
allow_production_rank_field = false
allow_sidecar_rank_field = false
production_rank_activation = false
feeds_production_ranking = false
feeds_reports = false
feeds_composite_scores = false
replace_final_composite_score = false
required_fields = [
  "ticker",
  "as_of_date",
  "decision_time",
  "prob_up_1d_candidate",
  "model_version",
  "model_type",
  "feature_set_version",
  "feature_schema_version",
  "feature_schema_columns",
  "label_contract_version",
  "adjusted_close_source_field",
  "adjusted_close_canonical_source_status",
  "prob_up_1d_feature_status",
  "prob_up_1d_feature_valid_count",
  "feature_expected_count",
  "feature_coverage_ratio",
  "data_quality_flag",
]

[sidecar_selection_packet_output_path]
root = "reports/v0_2_predictive_probability/candidate_sidecar/selection_packet"
filename_template = "prob_up_1d_candidate_selection_packet_{as_of_date}.csv"
manifest_template = "prob_up_1d_candidate_selection_packet_{as_of_date}.manifest.json"
generated_output = true
source_controlled_by_default = false

[features]
allow_existing_technical_scores = true
allow_production_composite_scores = false
allow_daily_ohlcv_derived_features = true
allow_missing_data_indicators = true
allow_warmup_coverage_flags = true
allow_static_non_fundamental_join_keys = true
allow_fundamental_or_valuation_data = false
allow_backtest_outputs = false
allow_evaluation_outputs = false
allow_realized_future_returns = false
allow_label_columns_as_features = false

[feature_allowlist]
mode = "default_deny"
feature_input_path = "src.scores.prob_up_1d_candidate.build_prob_up_1d_feature_input_frame"
feature_source = "step9_raw_technical_old_scores"
schema_consistency_validator = "src.scores.prob_up_1d_candidate.validate_prob_up_1d_schema_consistency"
old_score_feature_columns = [
  "short_term_overreaction_raw",
  "atr_adjusted_oversold_distance_raw",
  "rsi_price_divergence_raw",
  "realized_vol_percentile_raw",
  "donchian_breakout_distance_raw",
  "bollinger_width_squeeze_raw",
  "cmf_confirmation_raw",
  "efficiency_ratio_trend_raw",
]
allowed_source_fields = [
  "ticker",
  "date",
  "decision_time",
  "execution_time",
  "source_data_availability_time",
  "feature_construction_time",
  "open",
  "high",
  "low",
  "close",
  "volume",
  "adjusted_close",
]
allowed_feature_families = [
  "trailing_ohlcv_return",
  "trailing_range_volatility",
  "technical_indicator_component",
  "missing_data_indicator",
  "warmup_coverage_flag",
  "static_non_fundamental_join_key",
  "same_date_kospi200_cross_sectional_technical",
]

[missing_data_policy]
feature_status_field = "prob_up_1d_feature_status"
feature_valid_count_field = "prob_up_1d_feature_valid_count"
ready_feature_status = "ready"
missing_feature_status = "missing_features"
train_eval_requires_complete_features = true
inference_missing_probability = "prob_up_1d_candidate remains null when allowlisted features are incomplete"

[walk_forward_evaluation]
enabled = true
implementation_path = "src.scores.prob_up_1d_candidate.evaluate_prob_up_1d_candidate_walk_forward"
export_path = "src.scores.prob_up_1d_candidate.export_prob_up_1d_walk_forward_evaluation"
evaluation_source = "time_ordered_walk_forward_candidate_quality"
split_mode = "time_ordered_expanding_window"
initial_train_periods = 20
eval_periods = 5
step_periods = 5
minimum_folds = 2
calibration_bins = 5
train_eval_inference_separation_required = true
random_split_primary = false
candidate_only_diagnostic = true
feeds_production_ranking = false
feeds_reports = false
feeds_composite_scores = false
replace_technical_composite_score = false
replace_final_composite_score = false
feeds_model_selection_from_return_performance = false
required_metrics = [
  "brier_score",
  "log_loss",
  "calibration_error",
  "coverage",
  "nan_missing_rate",
  "feature_stability_mean_abs_shift",
]
interpretation_limits = [
  "candidate_only_model_quality_diagnostic",
  "not_production_ranking_activation",
  "not_final_or_technical_composite_replacement",
  "not_report_behavior_change",
  "not_model_selection_feedback_from_return_performance",
]

[walk_forward_evaluation_output_path]
root = "reports/v0_2_predictive_probability/evaluation"
summary_template = "prob_up_1d_candidate_walk_forward_metric_summary_{as_of_date}.csv"
fold_metrics_template = "prob_up_1d_candidate_walk_forward_fold_metrics_{as_of_date}.csv"
calibration_template = "prob_up_1d_candidate_walk_forward_calibration_{as_of_date}.csv"
feature_stability_template = "prob_up_1d_candidate_walk_forward_feature_stability_{as_of_date}.csv"
manifest_template = "prob_up_1d_candidate_walk_forward_evaluation_{as_of_date}.manifest.json"
generated_output = true
source_controlled_by_default = false

[forbidden_feature_patterns]
contains_any = [
  "label",
  "target",
  "future",
  "forward_return",
  "next_day_return",
  "next_adjusted_close",

brokerage_integration_enabled = false
order_generation_enabled = false
notes = "Approved only for candidate-only evidence planning; does not replace production ranking."
validation_rules = ["no_production_ranking", "no_live_execution", "candidate_only"]
dependency_refs = ["config/horizon_policy.toml"]


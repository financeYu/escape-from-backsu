# Route-only change impact matrix.
# This file does not authorize implementation or change contract semantics.

default_context:
  - docs/context/MVP_V0_1_BASELINE.md
  - docs/context/MVP_V0_1_CONTRACT_MANIFEST.toml
  - docs/context/EXTENSION_REGISTRY.toml
  - docs/context/CHANGE_IMPACT_MATRIX.yml
  - task-specific files only

archive_lookup:
  index: docs/context/ARCHIVE_INDEX.md
  default_read: false
  allowed_reasons:
    - regression investigation
    - provenance/source confirmation
    - release/freeze verification
    - resolving contradiction with MVP v0.1 baseline

validation_profiles:
  context_only:
    applies_to:
      - docs/context routing packets, sidecars, and domain stubs
      - archive index updates that do not alter active contract semantics
    validation:
      - git diff --check
      - parse changed toml/yml when local parsers are available
      - targeted forbidden-claim grep
      - confirm no source/config/runtime output files changed

  source_logic:
    applies_to:
      - src/** runtime logic
      - chart_mvp/src/** runtime logic
      - reusable validators, scanners, scoring, ranking, or report builders
    validation:
      - affected unit tests for changed code paths
      - focused integration check when ranking, reports, or pipeline outputs can change
      - forbidden-scope search for new universe, valuation, or backtest-feedback activation
      - git diff --check

  data_ingestion:
    applies_to:
      - data provider code
      - universe lists, symbol policy, cache path policy, and schema loaders
      - research ingestion adapters or collection config
    validation:
      - targeted data validation or provider tests for changed paths
      - confirm KOSPI200/Naver MVP defaults remain unchanged unless a later approved Step opens the scope
      - confirm no live KOSDAQ150, futures/options, Nasdaq/overseas, or multi-universe ingestion is enabled
      - generated-output/cache boundary check

  backtest:
    applies_to:
      - Quant_mvp/backtest_mvp/**
      - src/backtest/** compatibility facade
      - Step 17 backtest guardrails and tests
    validation:
      - focused backtest boundary tests
      - confirm backtest outputs remain evaluation-only
      - confirm no backtest output updates score, ranking, adoption, or optimization inputs
      - forbidden valuation/fundamental input-column check

  reports:
    applies_to:
      - report builders, report templates, generated-output routing, and report boundary docs
      - reports promoted as review fixtures
    validation:
      - focused report boundary tests
      - forbidden investment-claim wording grep
      - generated-output/cache boundary check
      - confirm reports remain explanatory context and do not re-rank or recommend

  validation:
    applies_to:
      - src/validation/**
      - tests/validation/**
      - contract, schema, and guardrail tests
    validation:
      - affected validation tests
      - contract/schema parser checks when applicable
      - confirm guardrails are strengthened or clarified, not weakened
      - git diff --check

impact_routes:
  docs_only_archive_routing:
    allowed_paths:
      - docs/context/ARCHIVE_INDEX.md
      - docs/context/*.md
      - docs/context/*.toml
      - docs/context/*.yml
      - docs/*.md
    forbidden_changes:
      - source code
      - scoring config
      - ranking config
      - report templates
      - data ingestion modules
      - backtest modules
      - dependency files
      - lockfiles
    validation:
      - profile: context_only

  runtime_or_contract_change:
    requires:
      - separately approved post-MVP step
      - correct role branch/worktree
      - conflict checkpoint
      - matching validation profile from validation_profiles

  extension_readiness_contract_refactor:
    status: MVP v0.1 pre-freeze readiness hardening only; not Step 21 entry
    allowed_paths:
      - docs/extension/*.md
      - docs/context/EXTENSION_REGISTRY.toml
      - src/preprocess/
      - src/scanner/
      - src/validation/
      - chart_mvp/src/stock_core/
      - chart_mvp/tests/
      - tests/data_validation/
      - tests/scanner/
      - tests/validation/
      - Quant_mvp/config/
    forbidden_changes:
      - live market data providers for new markets
      - new ticker lists or derivative contract chains
      - score formula, normalization, ranking, report, backtest, or valuation semantics
      - generated runtime outputs
    validation:
      - profile: source_logic when runtime code changes
      - profile: validation when guardrails or tests change
      - profile: context_only when only docs/context sidecars change
      - forbidden-scope search for activation language
      - git diff --check

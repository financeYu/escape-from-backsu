name: Context CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - "codex/**"

permissions:
  contents: read

jobs:
  context-tests:
    name: Context tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependency
        run: python -m pip install --upgrade pip pytest

      - name: Run context tests
        run: python -m pytest tests/context -q

      - name: Check context packet CLI
        run: python scripts/context/build_context_packet.py --help

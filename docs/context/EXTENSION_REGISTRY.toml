  "ResearchHypothesis",
  "StrategyHypothesis",
  "StrategyCandidate",
  "EvaluationEvidence",
  "AdoptionCandidate",
]
allowed = [
  "research idea intake and provenance/license/evidence mapping",
  "StrategyHypothesis drafting",
  "StrategyCandidate registry, schema, fixtures, and validation checks",
  "candidate-only backtest/simulation evidence in approved owner lanes",
  "EvaluationEvidence and evidence-only candidate comparison summaries",

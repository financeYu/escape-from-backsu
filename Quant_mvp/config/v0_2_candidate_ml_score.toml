# Candidate-only v0.2 ML score configuration.
# This config defines contract semantics only; it does not activate production ranking.
# Gate 1 is contract freeze only; it does not train a model or generate sidecar files.

[candidate_score]
name = "prob_up_1d_candidate"
version = "v0.2"
status = "candidate_only"
output_type = "sidecar_candidate_only"
description = "Modeled probability that adjusted_close[t+1] > adjusted_close[t] using features available at decision_time."
higher_is_better = true
production_rank_activation = false
replace_technical_composite_score = false
replace_final_composite_score = false
allow_trading_recommendations = false

[final_score_contract]
contract_only = true
runtime_replacement_enabled = false
final_score_output_contract_enabled = true
production_ranking_activation_enabled = false
report_behavior_activation_enabled = false
governance_approval_token = "QG_APPROVED_FINAL_SCORE_PROB_UP_1D_V0_2"
final_score_semantic_version = "v0_2_prob_up_1d"
final_score_source = "prob_up_1d_candidate"
final_score_requires_calibration_pass = true
final_score_missing_policy = "exclude_from_ranking"
final_score_sort_direction = "desc"
score_range = [0.0, 1.0]
v0_1_final_score_meaning = "technical_composite_score"
v0_1_baseline_frozen = true
allow_runtime_replacement_before_all_gates_pass = false

[calibration_gate]
required_before_final_score_promotion = true
metric_brier_score_required = true
metric_expected_calibration_error_required = true
max_brier_score = 0.35
max_expected_calibration_error = 0.35
calibration_curve_required_for_review = true
output_remains_candidate_before_pass = true

[adjusted_close_source]
label_source_field = "adjusted_close"
repo_availability_status = "BLOCKER_UNTIL_CONFIRMED_ADJUSTED_CLOSE_SOURCE"
known_optional_aliases = ["adj_close"]
require_canonical_adjusted_close = true
allow_close_fallback = false
allow_new_market_data_ingestion = false
must_validate_before_label_construction = true

[universe]
baseline = "MVP_v0_1_frozen"
market = "KOSPI200"
allow_new_market_activation = false
allow_kosdaq = false
allow_derivatives = false
allow_overseas = false

[timing]
decision_time_field = "decision_time"
execution_time_field = "execution_time"
label_time_field = "label_time"
label_availability_time_field = "label_availability_time"
label_field = "up_1d_label"
label_definition = "adjusted_close[t+1] > adjusted_close[t]"
exclude_unlabeled_current_row_from_training = true
require_features_available_at_or_before_decision_time = true
require_execution_time_after_decision_time = true
require_label_time_after_decision_time = true
require_label_availability_after_decision_time = true
allow_future_data = false
allow_lookahead = false

[outputs]
probability_field = "prob_up_1d_candidate"
rank_field = "prob_up_1d_candidate_sidecar_rank"
status_field = "prob_up_1d_candidate_status"
sample_role_field = "prob_up_1d_candidate_sample_role"
required_output_fields = [
  "ticker",
  "date",
  "decision_time",
  "execution_time",
  "label_time",
  "label_availability_time",
  "prob_up_1d_candidate",
  "prob_up_1d_candidate_status",
  "prob_up_1d_candidate_sample_role",
]
forbidden_production_fields_to_write = [
  "technical_composite_score",
  "final_composite_score",
  "rank",
  "production_rank",
]

[sidecar_ranking]
enabled = false
contract_defined = true
implementation_status = "not_implemented_gate_1"
artifact_type = "sidecar_candidate_only"
sort_fields = ["prob_up_1d_candidate", "ticker"]
sort_directions = ["desc", "asc"]
ties = "ticker_ascending"
feeds_production_ranking = false
feeds_reports = false
feeds_gui = false
feeds_composite_scores = false

[sidecar_output_path]
root = "reports/v0_2_predictive_probability/candidate_sidecar"
filename_template = "prob_up_1d_candidate_candidate_only_sidecar_{as_of_date}.csv"
manifest_template = "prob_up_1d_candidate_candidate_only_sidecar_{as_of_date}.manifest.json"
as_of_date_format = "YYYYMMDD"
generation_implemented_in_gate_1 = false
required_schema = [
  "ticker",
  "date",
  "decision_time",
  "execution_time",
  "prob_up_1d_candidate",
  "prob_up_1d_candidate_status",
  "prob_up_1d_candidate_sample_role",
  "feature_set_version",
  "label_contract_version",
]
forbidden_schema_fields = [
  "technical_composite_score",
  "final_composite_score",
  "rank",
  "production_rank",
  "recommendation_text",
  "forecasted_return",
  "valuation_signal",
]

[features]
allow_existing_technical_scores = true
allow_production_composite_scores = false
allow_daily_ohlcv_derived_features = true
allow_missing_data_indicators = true
allow_warmup_coverage_flags = true
allow_static_non_fundamental_join_keys = true
allow_fundamental_or_valuation_data = false
allow_backtest_outputs = false
allow_evaluation_outputs = false
allow_realized_future_returns = false
allow_label_columns_as_features = false

[feature_allowlist]
mode = "default_deny"
allowed_source_fields = [
  "ticker",
  "date",
  "decision_time",
  "execution_time",
  "source_data_availability_time",
  "feature_construction_time",
  "open",
  "high",
  "low",
  "close",
  "volume",
  "adjusted_close",
]
allowed_feature_families = [
  "trailing_ohlcv_return",
  "trailing_range_volatility",
  "technical_indicator_component",
  "missing_data_indicator",
  "warmup_coverage_flag",
  "static_non_fundamental_join_key",
  "same_date_kospi200_cross_sectional_technical",
]

[forbidden_feature_patterns]
contains_any = [
  "label",
  "target",
  "future",
  "forward_return",
  "next_day_return",
  "next_adjusted_close",
  "future_return",
  "realized_return",
  "backtest",
  "evaluation",
  "generated_report",
  "report_output",
  "ranking_output",
  "candidate_sidecar",
  "technical_composite_score",
  "final_composite_score",
  "pnl",
  "sharpe",
  "alpha",
  "per",
  "pbr",
  "roe",
  "eps",
  "bps",
  "fundamental",
  "valuation",
  "filing",
  "accounting",
]

[no_lookahead_validation]
required_time_fields = [
  "decision_time",
  "execution_time",
  "label_time",
  "label_availability_time",
]
feature_time_must_be_lte_decision_time = true
source_availability_must_be_lte_decision_time = true
label_time_must_be_after_decision_time = true
label_availability_must_be_after_decision_time = true
latest_candidate_row_may_be_unlabeled = true
label_fields_forbidden_from_features = [
  "up_1d_label",
  "label_time",
  "label_availability_time",
]

[feedback_boundary]
backtest_feedback_into_features = false
backtest_feedback_into_scoring = false
backtest_feedback_into_ranking = false
evaluation_feedback_into_features = false
adoption_decision_from_candidate_output = false

[language_policy]
allowed_terms = [
  "candidate probability",
  "modeled probability",
  "sidecar candidate ranking",
  "candidate-only",
]
forbidden_terms = [
  "direct_trading_recommendation",
  "performance_claim",
  "forecasted_return_claim",
  "production ranking replacement",
]

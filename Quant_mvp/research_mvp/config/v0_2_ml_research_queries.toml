# v0.2 candidate-only ML research query pack.
# This file is a research/reference config only. It does not implement API clients,
# paper downloading, model training, scoring, ranking, or report behavior.

[metadata]
contract_version = "v0_2_ml_research_queries.v1"
owner = "Quant_mvp"
upstream_research_owner = "Quant_mvp/research_mvp"
route = "prob_up_1d_candidate"
status = "reference_query_pack_only"

[guardrails]
candidate_only = true
live_collection_implemented = false
pdf_downloader_implemented = false
model_training_implemented = false
production_rank_activation = false
replace_technical_composite_score = false
replace_final_composite_score = false
backtest_feedback_to_training = false
backtest_metric_as_feature = false
allow_trading_language = false

[source_names]
preferred = [
  "arxiv",
  "ssrn",
  "nber",
  "openalex",
  "crossref",
  "semantic_scholar",
  "official_docs",
  "academic_publisher",
]
background_only = ["low_quality_trading_blog"]

[evidence_levels]
allowed = [
  "metadata_only",
  "abstract_reviewed",
  "license_verified_pdf_collected",
  "full_text_reviewed",
  "project_validated",
]
implementation_gate_minimum = ["full_text_reviewed", "project_validated"]
metadata_only_use = "discovery_only"

[implementation_readiness]
allowed = [
  "discovery_only",
  "contract_reference_candidate",
  "implementation_reference_candidate",
  "requires_license_review",
  "requires_full_text_review",
  "requires_project_validation",
]

[allowed_use_values]
allowed = [
  "reference_only",
  "validation_method_candidate",
  "label_design_reference",
  "calibration_reference",
  "model_candidate_reference",
  "architecture_reference",
]

[forbidden_use_values]
forbidden = [
  "direct_feature_input",
  "production_ranking_activation",
  "final_composite_score_change",
  "backtest_metric_as_feature",
  "backtest_feedback_to_training",
  "trading_claim",
  "expected_return_claim",
  "buy_sell_hold_recommendation",
]

[[query_sets]]
id = "labeling_no_lookahead"
taxonomy_tags = ["labeling_no_lookahead"]
allowed_use = ["label_design_reference", "reference_only"]
source_names = ["arxiv", "ssrn", "openalex", "crossref", "semantic_scholar", "academic_publisher"]
terms = [
  "fixed horizon label financial machine learning",
  "triple barrier method financial machine learning",
  "meta labeling financial machine learning",
  "label availability time no lookahead financial time series",
  "decision time execution time label time leakage financial machine learning",
]

[[query_sets]]
id = "time_series_validation"
taxonomy_tags = ["time_series_validation", "labeling_no_lookahead"]
